<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin — ShopROBUXGMHUB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0f0e;color:#f4f6f5}.wrap{max-width:1100px;margin:auto;padding:28px 16px 50px}.brand{font-size:24px;font-weight:800}.muted{color:#9da5a1}.card{background:#151817;border:1px solid #2a302d;border-radius:18px;padding:18px;margin-bottom:16px}.login{max-width:460px;margin:8vh auto}.input{width:100%;padding:14px;border:1px solid #343b37;background:#0f1211;color:#fff;border-radius:12px;font:inherit;margin:7px 0}.btn{border:0;border-radius:12px;padding:13px 16px;background:#00a86b;color:white;font-weight:800;font-size:15px}.btn.secondary{background:#202623}.btn.danger{background:#4a1d1d;color:#ffb8b8}.actions{display:flex;gap:10px;flex-wrap:wrap}.msg{min-height:20px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#151817;border:1px solid #2a302d;border-radius:16px;padding:16px}.stat b{font-size:26px;display:block;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar .input{flex:1;min-width:220px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 10px;border-bottom:1px solid #292f2c;text-align:left}th{color:#9da5a1;font-size:13px}.status{padding:9px;border:1px solid #343b37;border-radius:9px;background:#0f1211;color:#fff}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#18352c;color:#65e0b2;font-size:12px;font-weight:800}.code{font-family:ui-monospace,monospace;font-weight:800}.small{font-size:13px}.setup{background:#10261e;border-color:#1d6b50}.hint{line-height:1.5}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{padding-top:18px}.top{gap:12px;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body><div class="wrap">
<div id="setupView" class="hidden"></div>
<div id="loginView" class="card login hidden">
  <div class="brand">ROBUX SHOP ADMIN</div><p class="muted">Đăng nhập bằng tài khoản Supabase đã được cấp quyền admin.</p>
  <input class="input" id="email" type="email" placeholder="Email admin" autocomplete="email">
  <input class="input" id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
  <button class="btn" id="loginBtn" onclick="login()">Đăng nhập</button><p id="loginMsg" class="msg"></p>
</div>
<div id="appView" class="hidden">
  <div class="top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class="brand">ShopROBUXGMHUB</div><div class="muted small">Admin Dashboard</div></div><div class="actions"><button class="btn secondary" onclick="loadOrders()">↻ Làm mới</button><button class="btn danger" onclick="logout()">Đăng xuất</button></div></div>
  <div class="stats"><div class="stat"><span class="muted small">Tổng đơn</span><b id="total">0</b></div><div class="stat"><span class="muted small">Chờ thanh toán</span><b id="pending">0</b></div><div class="stat"><span class="muted small">Đã thanh toán</span><b id="paid">0</b></div><div class="stat"><span class="muted small">Hoàn thành</span><b id="completed">0</b></div></div>
  <div class="card" style="margin-top:16px"><div class="toolbar"><input class="input" id="search" placeholder="Tìm mã đơn hoặc Roblox username" oninput="renderOrders()"><button class="btn secondary" onclick="loadOrders()">Tải đơn hàng</button></div><p id="appMsg" class="msg"></p><div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Roblox</th><th>Robux</th><th>Số tiền</th><th>Trạng thái</th><th>Thời gian</th><th></th></tr></thead><tbody id="orders"></tbody></table></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const DEFAULT_URL='https://fvrrjheianuwmspojlv.supabase.co';const DEFAULT_KEY='sb_publishable_R34IlkH_urvdQxcTKgKl2w_gxibdZK8';let sb=null,allOrders=[];
const STATUS=['pending_payment','paid','delivering','completed','cancelled'];const LABEL={pending_payment:'Chờ thanh toán',paid:'Đã thanh toán',delivering:'Đang giao',completed:'Hoàn thành',cancelled:'Đã hủy'};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function money(v){return Number(v||0).toLocaleString('vi-VN')+'₫'}function date(v){return v?new Date(v).toLocaleString('vi-VN'):'-'}function msg(id,t,e=false){let x=document.getElementById(id);x.textContent=t;x.style.color=e?'#ff8f8f':'#65e0b2'}
function show(which){['setupView','loginView','appView'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==which))}
async function init(){sb=supabase.createClient(DEFAULT_URL,DEFAULT_KEY);show('loginView');let {data:{session}}=await sb.auth.getSession();if(session)boot()}
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg('loginMsg','Vui lòng nhập email và mật khẩu.',true);return}let b=document.getElementById('loginBtn');b.disabled=true;msg('loginMsg','Đang đăng nhập...');let {error}=await sb.auth.signInWithPassword({email,password});b.disabled=false;if(error){msg('loginMsg',error.message,true);return}boot()}
async function boot(){let {data:{user}}=await sb.auth.getUser();if(!user){show('loginView');return}let {data:admin,error}=await sb.from('admin_users').select('user_id,role').eq('user_id',user.id).maybeSingle();if(error||!admin){await sb.auth.signOut();show('loginView');msg('loginMsg','Tài khoản này chưa được cấp quyền admin.',true);return}show('appView');loadOrders()}
async function logout(){await sb.auth.signOut();show('loginView')}
async function loadOrders(){msg('appMsg','Đang tải đơn hàng...');let {data,error}=await sb.from('orders').select('id,order_code,roblox_username,robux,amount_vnd,status,created_at,paid_at,payment_reference').order('created_at',{ascending:false}).limit(200);if(error){msg('appMsg',error.message,true);return}allOrders=data||[];updateStats();renderOrders();msg('appMsg','Đã tải '+allOrders.length+' đơn.')}
function updateStats(){total.textContent=allOrders.length;pending.textContent=allOrders.filter(x=>x.status==='pending_payment').length;paid.textContent=allOrders.filter(x=>x.status==='paid').length;completed.textContent=allOrders.filter(x=>x.status==='completed').length}
function renderOrders(){let q=document.getElementById('search').value.trim().toLowerCase(),rows=allOrders.filter(o=>!q||String(o.order_code).toLowerCase().includes(q)||String(o.roblox_username).toLowerCase().includes(q));let body=document.getElementById('orders');if(!rows.length){body.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px" class="muted">Không có đơn phù hợp.</td></tr>';return}body.innerHTML=rows.map(o=>'<tr><td><span class="code">'+esc(o.order_code)+'</span><br><span class="small muted">'+esc(o.payment_reference||'')+'</span></td><td><b>'+esc(o.roblox_username)+'</b></td><td>'+Number(o.robux).toLocaleString('vi-VN')+'</td><td>'+money(o.amount_vnd)+'</td><td><select class="status" id="s-'+esc(o.id)+'">'+STATUS.map(s=>'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+LABEL[s]+'</option>').join('')+'</select></td><td class="small">'+date(o.created_at)+'</td><td><button class="btn" onclick="saveStatus(\''+esc(o.id)+'\')">Lưu</button></td></tr>').join('')}
async function saveStatus(id){let sel=document.getElementById('s-'+id);if(!sel)return;let status=sel.value,old=allOrders.find(o=>o.id===id),patch={status};if(status==='paid'&&!old?.paid_at)patch.paid_at=new Date().toISOString();let {error}=await sb.from('orders').update(patch).eq('id',id);if(error){msg('appMsg',error.message,true);return}msg('appMsg','Đã cập nhật trạng thái đơn.');loadOrders()}
if(window.supabase) init();
</script></body></html>
